<!DOCTYPE html>
<!--
  demo/index.html — NCA demo 薄殼（repo 內唯一前端檔）。

  本檔「不含任何運算邏輯」：沒有座標轉換、沒有 payload 組裝、沒有協定知識。
  它只做四件事：
    1. 提供 DOM 掛載容器 #nca-demo-root 與樣式（含下方架構圖／裝飾層）
    2. 從 CDN 載入 p5.js
    3. 載入 ./app.js（全部邏輯在那）
    4. 呼叫 NCADemo.boot('./demo.config.json') 讓 app.js 自行載 config 並建 UI

  架構圖（#arch-diagram）與環境動畫純裝飾，全部 CSS/SVG，本檔零邏輯。
  唯一「有狀態」的視覺回饋：app.js 在既有的連線／即時模式切換點額外多寫兩個
  <html data-arch-connected> / data-arch-live> 屬性（純 DOM 屬性 bookkeeping，
  跟它本來就在做的 el.dot.classList 同一類動作），本檔的 CSS 選擇器讀這兩個屬性
  來決定架構圖要不要亮/動——決策邏輯仍 100% 在 app.js，這裡只有「屬性→樣式」的
  純表現對應。

  使用者只需編輯 demo.config.json（唯一面對使用者的 config）。
  操作說明見同目錄 demo/README.md（全部使用者需要的檔案/說明都在 demo/，
  不需進 src/ 原始碼）。file:// 下直接雙擊本檔也可用（會顯示啟動器面板，
  按鈕透過 launcher.py 起後端）；或用 demo/run_demo.bat 一鍵全自動啟動。
-->
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>NCA 互動 demo</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0f1115;
      --bg-elev: #171a20;
      --bg-elev-2: #1c2028;
      --border: #2a2f3a;
      --border-soft: #23272f;
      --text: #e6e6e6;
      --text-dim: #8a93a2;
      --accent: #2f6feb;
      --accent-warm: #b9770e;
      --accent-live: #c0392b;
      --accent-live-on: #27ae60;
      --radius: 10px;
      --radius-sm: 6px;
    }
    * { box-sizing: border-box; }
    body {
      font-family: system-ui, "Segoe UI", sans-serif;
      margin: 0; padding: 0 0 32px;
      background: var(--bg); color: var(--text);
      position: relative; overflow-x: hidden;
    }

    /* ── 環境裝飾：極淡的橫向流線動畫（純 CSS，呼應風場主題，不佔互動）── */
    body::before {
      content: ""; position: fixed; inset: 0; z-index: 0; pointer-events: none;
      opacity: 0.05;
      background-image: repeating-linear-gradient(
        90deg, var(--accent) 0px, var(--accent) 1px, transparent 1px, transparent 64px
      );
      background-size: 640px 100%;
      animation: flow-drift 18s linear infinite;
    }
    @keyframes flow-drift { from { background-position: 0 0; } to { background-position: -640px 0; } }
    @media (prefers-reduced-motion: reduce) {
      body::before { animation: none; }
    }

    .page { position: relative; z-index: 1; max-width: 1100px; margin: 0 auto; padding: 0 16px; }

    /* ── Hero header ── */
    header.hero { padding: 22px 4px 16px; border-bottom: 1px solid var(--border-soft); margin-bottom: 18px; }
    header.hero h1 { font-size: 19px; margin: 0 0 4px; font-weight: 700; letter-spacing: 0.2px; }
    header.hero p.sub { margin: 0; font-size: 13px; color: var(--text-dim); }

    /* ── 卡片通用外殼 ── */
    .card {
      background: var(--bg-elev); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 14px 16px; margin-bottom: 16px;
    }
    .card > h2 {
      font-size: 12px; text-transform: uppercase; letter-spacing: 0.6px; color: var(--text-dim);
      margin: 0 0 12px; font-weight: 600;
    }

    /* ── 架構圖卡片 ── */
    #arch-diagram { width: 100%; height: auto; display: block; }
    .arch-node rect {
      fill: var(--bg-elev-2); stroke: var(--border); stroke-width: 1.5; transition: stroke 0.3s, fill 0.3s;
    }
    .arch-node text { fill: var(--text); font-size: 11px; font-family: inherit; }
    .arch-node .sub { fill: var(--text-dim); font-size: 9px; }
    .arch-path { stroke: var(--border); stroke-width: 2; fill: none; }
    .arch-path.dashed { stroke-dasharray: 4 4; opacity: 0.6; }
    .arch-arrow { fill: var(--border); }

    /* 連線中：Browser↔main.py 路徑與兩端節點亮起 */
    html[data-arch-connected="1"] .arch-path--ws { stroke: var(--accent); stroke-width: 2.5; }
    html[data-arch-connected="1"] .arch-path--ws.animate {
      stroke-dasharray: 6 6; animation: dash-flow 1.2s linear infinite;
    }
    html[data-arch-connected="1"] .arch-node--browser rect,
    html[data-arch-connected="1"] .arch-node--main rect { stroke: var(--accent); stroke-width: 2; }
    @keyframes dash-flow { to { stroke-dashoffset: -24; } }

    /* Live 模式：main.py→GGUI 路徑 + GGUI 節點脈動 */
    html[data-arch-live="1"] .arch-path--proc { stroke: var(--accent-live-on); stroke-width: 2.5; }
    html[data-arch-live="1"] .arch-node--ggui rect {
      stroke: var(--accent-live-on); stroke-width: 2; animation: pulse-glow 1.6s ease-in-out infinite;
    }
    @keyframes pulse-glow {
      0%, 100% { filter: drop-shadow(0 0 0 rgba(39,174,96,0)); }
      50% { filter: drop-shadow(0 0 6px rgba(39,174,96,0.55)); }
    }
    .arch-hint { margin-top: 8px; font-size: 11px; color: var(--text-dim); line-height: 1.6; }

    /* ── 控制面板既有樣式（沿用/微調）── */
    h1 { font-size: 16px; margin: 0 0 8px; font-weight: 600; }
    .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 6px 0; }
    button { background: var(--bg-elev-2); color: var(--text); border: 1px solid var(--border);
             border-radius: var(--radius-sm); padding: 6px 10px; cursor: pointer; font-size: 13px;
             transition: background 0.15s, border-color 0.15s; }
    button:hover { background: #333a47; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.warm { background: var(--accent-warm); border-color: var(--accent-warm); }
    select, input { background: var(--bg-elev-2); color: var(--text); border: 1px solid var(--border);
                    border-radius: var(--radius-sm); padding: 5px 8px; font-size: 13px; }
    #dot { width: 11px; height: 11px; border-radius: 50%; background: var(--accent-live);
           display: inline-block; transition: background 0.2s; }
    #dot.on { background: var(--accent-live-on); box-shadow: 0 0 6px rgba(39,174,96,0.6); }
    #log { font-family: ui-monospace, Consolas, monospace; font-size: 12px; background: #0d0f12;
           border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 8px; height: 120px;
           overflow: auto; white-space: pre-wrap; margin-top: 8px; }
    .hint { color: var(--text-dim); font-size: 12px; }
    #wrap { display: flex; gap: 16px; flex-wrap: wrap; }
    #canvas-holder { border: 1px solid var(--border); border-radius: var(--radius-sm); overflow: hidden; }

    /* ── 載入骨架（app.js 建好 UI 後會整個被 innerHTML='' 取代，純裝飾）── */
    .skeleton { display: flex; flex-direction: column; gap: 8px; }
    .skeleton .bar { height: 14px; border-radius: 4px; background: linear-gradient(
        90deg, var(--bg-elev-2) 25%, var(--border-soft) 37%, var(--bg-elev-2) 63%
      ); background-size: 400% 100%; animation: skeleton-shine 1.4s ease infinite; }
    .skeleton .bar.w60 { width: 60%; } .skeleton .bar.w80 { width: 80%; } .skeleton .bar.w40 { width: 40%; }
    @keyframes skeleton-shine { 0% { background-position: 100% 0; } 100% { background-position: -100% 0; } }

    footer.foot { margin-top: 24px; padding-top: 14px; border-top: 1px solid var(--border-soft);
                  font-size: 11px; color: var(--text-dim); display: flex; gap: 16px; flex-wrap: wrap; }
    footer.foot a { color: var(--text-dim); }
    footer.foot a:hover { color: var(--text); }
  </style>
</head>
<body>
  <div class="page">
    <header class="hero">
      <h1>NCA 互動 demo</h1>
      <p class="sub">即時 GPU 風環境模擬控制面板 — 幾何編輯 → WebSocket → NCA 推論 → Taichi GGUI 視覺化</p>
    </header>

    <section class="card" aria-label="通訊架構圖">
      <h2>通訊架構</h2>
      <svg id="arch-diagram" viewBox="0 0 640 190" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
            <path class="arch-arrow" d="M0,0 L6,3 L0,6 Z" />
          </marker>
        </defs>

        <!-- 輔助節點：launcher / http.server（虛線，僅 bootstrap 用，靜態不反應） -->
        <g class="arch-node arch-node--launcher">
          <rect x="8" y="8" width="118" height="34" rx="6" />
          <text x="67" y="24" text-anchor="middle">launcher.py</text>
          <text class="sub" x="67" y="36" text-anchor="middle">:8090 常駐</text>
        </g>
        <g class="arch-node arch-node--http">
          <rect x="8" y="148" width="118" height="34" rx="6" />
          <text x="67" y="164" text-anchor="middle">http.server</text>
          <text class="sub" x="67" y="176" text-anchor="middle">:8080 靜態檔</text>
        </g>
        <path class="arch-path dashed" d="M126,25 C 160,25 170,70 190,80" marker-end="url(#arrow)" />
        <path class="arch-path dashed" d="M126,165 C 160,165 170,110 190,100" marker-end="url(#arrow)" />

        <!-- 主鏈：Browser -> main.py -> GGUI -->
        <g class="arch-node arch-node--browser">
          <rect x="190" y="78" width="120" height="34" rx="6" />
          <text x="250" y="94" text-anchor="middle">瀏覽器</text>
          <text class="sub" x="250" y="106" text-anchor="middle">index.html + app.js</text>
        </g>

        <path class="arch-path arch-path--ws animate" d="M310,95 L 398,95" marker-end="url(#arrow)" />
        <text class="hint-inline" x="354" y="86" text-anchor="middle" font-size="9" fill="var(--text-dim)">WS :8765</text>

        <g class="arch-node arch-node--main">
          <rect x="400" y="78" width="120" height="34" rx="6" />
          <text x="460" y="94" text-anchor="middle">main.py</text>
          <text class="sub" x="460" y="106" text-anchor="middle">NCA 推論 GPU</text>
        </g>

        <path class="arch-path arch-path--proc" d="M520,95 L 598,95" marker-end="url(#arrow)" />
        <text x="559" y="86" text-anchor="middle" font-size="9" fill="var(--text-dim)">同進程</text>

        <g class="arch-node arch-node--ggui">
          <rect x="522" y="8" width="110" height="34" rx="6" transform="translate(0,140)" />
          <text x="577" y="164" text-anchor="middle">GGUI 視窗</text>
          <text class="sub" x="577" y="176" text-anchor="middle">流場實際顯示處</text>
        </g>
        <path class="arch-path" d="M577,112 L 577,148" marker-end="url(#arrow)" />
      </svg>
      <div class="arch-hint">
        圖僅示意通訊路徑（簡化版，完整含 config.yaml/GH/headless 三條路徑見
        <a href="../docs/ARCHITECTURE.md" style="color:var(--text-dim)">ARCHITECTURE.md</a>）。
        <b>流場本身不在網頁顯示</b>，畫面在獨立彈出的 Taichi GGUI 視窗——按 Connect 後看該視窗。
        連線時左段路徑亮起／流動；開啟「即時 Live」時 GGUI 節點脈動。
      </div>
    </section>

    <!-- file:// 下開啟時，app.js 會把「啟動 demo 後端」launcher 面板填入此容器 -->
    <div id="nca-launch-bar"></div>

    <!-- app.js 會把所有控制項（連線列／畫布／風力／Send／Live／viz／序列／log）填入此容器；
         下方 skeleton 純裝飾佔位，app.js 執行 buildUI() 時會 innerHTML='' 整個換掉。 -->
    <div id="nca-demo-root" class="card">
      <div class="skeleton">
        <div class="bar w40"></div>
        <div class="bar w80"></div>
        <div class="bar w60"></div>
      </div>
    </div>

    <footer class="foot">
      <span>lbm-nca-thesis / demo</span>
      <a href="./README.md">操作說明 README</a>
      <a href="../docs/ARCHITECTURE.md">完整通訊架構</a>
      <a href="./demo.config.json">demo.config.json</a>
    </footer>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.9.4/p5.min.js"></script>
  <script src="./app.js"></script>
  <script>NCADemo.boot('./demo.config.json');</script>
</body>
</html>
