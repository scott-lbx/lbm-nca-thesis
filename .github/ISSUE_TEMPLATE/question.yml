name: Question
description: Ask about the method, the data format, or how to reproduce a result
labels: ["question"]
body:
  - type: markdown
    attributes:
      value: |
        Before asking, please check `docs/` — in particular
        `docs/DATA_GENERATION.md` for regenerating the dataset and
        `docs/REPRODUCIBILITY.md` for reproducing reported numbers.

  - type: textarea
    id: question
    attributes:
      label: Question
    validations:
      required: true

  - type: textarea
    id: context
    attributes:
      label: What you have tried
      description: Commands run, documents read, and what was unclear.
