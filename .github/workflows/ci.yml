name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (CPU)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
        with:
          # Model weights are large and not needed for the CPU test suite.
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          # CPU wheels: CI has no GPU, and the GPU-marked tests are skipped.
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[solver,dev]"
      - name: Import smoke test
        run: python -c "import lbmnca; print(lbmnca.__version__)"
      - name: Tests
        # The `gpu` and `dataset` markers need a CUDA device and a locally
        # regenerated dataset, neither of which exists on a CI runner.
        run: pytest -m "not gpu and not dataset" -q
